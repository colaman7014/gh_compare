name: Revert Impact Check

# 唯讀查詢 workflow：輸入一個已合併需求分支的 merge commit SHA，
# 針對該 commit 改動的每個檔案，判斷回退時該走哪種流程。
# 不觸碰 main 或快照 branch，不需要 Environment 核准。

on:
  workflow_dispatch:
    inputs:
      merge_commit:
        description: "要回退的需求分支 merge commit SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate input commit
        run: |
          set -euo pipefail
          if ! git cat-file -e "${{ inputs.merge_commit }}^{commit}" 2>/dev/null; then
            echo "::error::commit ${{ inputs.merge_commit }} 不存在於此 repo"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${{ inputs.merge_commit }}" main; then
            echo "::error::${{ inputs.merge_commit }} 不是 main 的祖先，非有效 merge commit"
            exit 1
          fi

      - name: Classify affected files
        run: |
          set -euo pipefail
          MC="${{ inputs.merge_commit }}"

          {
            echo "## Revert Impact Check"
            echo ""
            echo "**目標 merge commit**: \`$MC\`"
            echo "$(git log -1 --format='> %H %s (%an, %ad)' --date=short "$MC")"
            echo ""
            echo "| 檔案 | 建議流程 | 說明 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          a_files=()
          b_files=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            hits=$(git log --oneline "${MC}..main" -- "$f")
            if [ -z "$hits" ]; then
              a_files+=("$f")
              echo "| \`$f\` | 開新 PR + \`git revert -m 1 $MC\` | 此檔案在目標 commit 之後未再被修改，可直接還原 |" >> "$GITHUB_STEP_SUMMARY"
            else
              b_files+=("$f")
              n=$(echo "$hits" | wc -l | tr -d ' ')
              echo "| \`$f\` | 開新 PR + 人工 review 手動編輯（先跑 \`git log ${MC}..main -- $f\`） | 此檔案之後仍被 $n 個 commit 修改過，直接還原會連同後續變更一起打掉，須人工確認保留內容 |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(git diff --name-only "${MC}^" "$MC")

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 後續處理方式" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${#b_files[@]}" -eq 0 ]; then
            {
              echo "**案例 A：全部檔案皆可直接 revert**"
              echo ""
              echo "開一個 PR，對整個 merge commit 直接執行還原（可複製整段執行）："
              echo ""
              echo '```bash'
              echo "git checkout -b revert/${MC}"
              echo "git revert -m 1 $MC"
              echo '```'
              echo ""
              echo "commit、push、開 PR、review、merge 即完成。"
            } >> "$GITHUB_STEP_SUMMARY"

          elif [ "${#a_files[@]}" -eq 0 ]; then
            {
              echo "**案例 B：全部檔案皆需人工 review**"
              echo ""
              echo "**禁止**對此 merge commit 執行 \`git revert\`（全部檔案之後都被其他已合併需求修改過）。開一個 PR，對每個檔案依序執行："
              echo ""
              echo "1. 列出此檔案之後動過的 commit：\`git log --oneline ${MC}..main -- <file>\`"
              echo "2. 用 commit message 中的 \`REQ-\` 編號，或 \`gh pr list --search <sha>\`（若有裝 gh），反查對應需求單與負責人"
              echo "3. 看目標 commit 當初改了什麼：\`git show $MC -- <file>\`"
              echo "4. 對步驟 1 列出的每個後續 commit 執行 \`git show <sha> -- <file>\`，確認各自加了什麼"
              echo "5. 比對目前檔案內容，判斷哪些部分屬於要回退的需求、哪些屬於後續需求"
              echo "6. 用編輯器手動修改檔案：只移除要回退需求的內容，保留後續需求的內容"
              echo "7. 找步驟 2 的負責人核對回退後內容是否仍符合他們原本需求，核對結果記錄在 PR 描述中"
              echo "8. commit、push、開 PR、review、merge"
            } >> "$GITHUB_STEP_SUMMARY"

          else
            {
              echo "**案例 A+B：同一個 merge commit 混合兩種檔案，分開處理，不要對整個 merge commit 執行 \`git revert\`**"
              echo ""
              echo "混合時直接 revert 整個 merge commit 會被 B 類檔案卡住或打掉後續需求的變更，改用下列方式拆開："
              echo ""
              echo "**A 類（可直接還原）逐檔處理，不使用 \`git revert\`：**"
              echo ""
              echo '```bash'
              echo "git checkout -b revert/${MC}"
              for f in "${a_files[@]}"; do
                echo "git checkout ${MC}^ -- \"$f\""
              done
              echo "git commit -m \"revert changes from $MC (A: no later modification)\""
              echo '```'
              echo ""
              echo "**B 類（需人工 review）逐檔處理：**"
              echo ""
              for f in "${b_files[@]}"; do
                echo "- \`$f\`：先跑 \`git log --oneline ${MC}..main -- $f\`，找出後續需求負責人核對，再手動編輯此檔只移除要回退的部分"
              done
              echo ""
              echo "A 類與 B 類的變更可合併成同一個 PR（分成不同 commit），PR 描述需列出 B 類檔案的核對結果。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "本 workflow 僅供查詢分流，不執行任何 revert 或寫入操作；實際還原一律開新 PR 走人工 review 流程。" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 不使用 gh CLI／此 workflow 時，如何在本機做同樣查詢" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          {
            echo "# 1. 先看這個 merge commit 改了哪些檔案"
            echo "git diff --name-only ${MC}^ ${MC}"
            echo ""
            echo "# 2. 對每個檔案，檢查 merge commit 之後 main 上是否還有其他 commit 動過它"
            echo "#    （純 git 指令，不需要 gh、不需要額外套件）"
            echo "git log --oneline ${MC}..main -- <file-path>"
            echo "# 空結果 → 可開 PR 直接 git revert"
            echo "# 有結果 → 開 PR 前先人工比對這些 commit 的內容，手動編輯還原"
          } >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
