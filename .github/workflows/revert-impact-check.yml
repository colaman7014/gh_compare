name: Revert Impact Check

# 唯讀查詢 workflow：輸入一個已合併需求分支的 merge commit SHA，
# 針對該 commit 改動的每個檔案，判斷回退時該走哪種流程。
# 不觸碰 main 或快照 branch，不需要 Environment 核准。

on:
  workflow_dispatch:
    inputs:
      merge_commit:
        description: "要回退的需求分支 merge commit SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate input commit
        run: |
          set -euo pipefail
          if ! git cat-file -e "${{ inputs.merge_commit }}^{commit}" 2>/dev/null; then
            echo "::error::commit ${{ inputs.merge_commit }} 不存在於此 repo"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${{ inputs.merge_commit }}" main; then
            echo "::error::${{ inputs.merge_commit }} 不是 main 的祖先，非有效 merge commit"
            exit 1
          fi

      - name: Classify affected files
        run: |
          set -euo pipefail
          MC="${{ inputs.merge_commit }}"

          {
            echo "## Revert Impact Check"
            echo ""
            echo "**目標 merge commit**: \`$MC\`"
            echo "$(git log -1 --format='> %H %s (%an, %ad)' --date=short "$MC")"
            echo ""
            echo "| 檔案 | 建議流程 | 說明 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          need_manual=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            hits=$(git log --oneline "${MC}..main" -- "$f")
            if [ -z "$hits" ]; then
              echo "| \`$f\` | 開新 PR + \`git revert -m 1 $MC\` | 此檔案在目標 commit 之後未再被修改，可直接還原 |" >> "$GITHUB_STEP_SUMMARY"
            else
              need_manual=1
              n=$(echo "$hits" | wc -l | tr -d ' ')
              echo "| \`$f\` | 開新 PR + 人工 review 手動編輯（先跑 \`git log ${MC}..main -- $f\`） | 此檔案之後仍被 $n 個 commit 修改過，直接還原會連同後續變更一起打掉，須人工確認保留內容 |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(git diff --name-only "${MC}^" "$MC")

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$need_manual" -eq 1 ]; then
            echo "> 部分檔案需開新 PR、人工 review 後手動編輯還原，禁止直接對整個 merge commit 執行 \`git revert\`。" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "> 全部檔案可開新 PR，並直接執行以下指令還原（可複製整段執行）："
              echo ""
              echo '```bash'
              echo "git checkout -b revert/${MC}"
              echo "git revert -m 1 $MC"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "本 workflow 僅供查詢分流，不執行任何 revert 或寫入操作；實際還原一律開新 PR 走人工 review 流程。" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 不使用 gh CLI／此 workflow 時，如何在本機做同樣查詢" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          {
            echo "# 1. 先看這個 merge commit 改了哪些檔案"
            echo "git diff --name-only ${MC}^ ${MC}"
            echo ""
            echo "# 2. 對每個檔案，檢查 merge commit 之後 main 上是否還有其他 commit 動過它"
            echo "#    （純 git 指令，不需要 gh、不需要額外套件）"
            echo "git log --oneline ${MC}..main -- <file-path>"
            echo "# 空結果 → 可開 PR 直接 git revert"
            echo "# 有結果 → 開 PR 前先人工比對這些 commit 的內容，手動編輯還原"
          } >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
